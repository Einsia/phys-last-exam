schema_version: continuous-0-1-v1
task_id: P6
input_floor: 0.01
valid_score_floor: 0.01

# Residual quality is q(r,s)=1/(1+r/s), so every frozen legacy boundary s is
# exactly the half-quality anchor.  Increasing-evidence counts use x/(x+s),
# the monotone mirror of the same curve.  Coverage is expressed as a deficit
# residual 1-c with the legacy allowed deficit as its scale.
dimensions:
  task_structure:
    components:
      track_coverage:
        {kind: coverage_deficit, metric: track_coverage, scale: 0.15, weight: 0.22}
      pattern_coverage:
        {kind: coverage_deficit, metric: pattern_coverage, scale: 0.35, weight: 0.12}
      motion_evidence:
        {kind: evidence, metric: motion_frame_count, scale: 24.0, weight: 0.12}
      joint_measurement_evidence:
        {kind: evidence, metric: valid_ratio_frame_count, scale: 12.0, weight: 0.12}
      angular_evidence:
        {kind: evidence, metric: angular_span_rad, scale: 1.0, weight: 0.12}
      radius_stability:
        {kind: residual, metric: radius_cv, scale: 0.18, weight: 0.10}
      locked_camera:
        {kind: residual, metric: camera_drift_width, scale: 0.02, weight: 0.10}
      visual_identity_continuity:
        {kind: residual, metric: max_hough_dropout_run_frames, scale: 12.0, weight: 0.10}

  center_contact_geometry:
    components:
      center_path_residual:
        {kind: residual, metric: path_normal_p95_r, scale: 0.45, weight: 0.70}
      radius_stability:
        {kind: residual, metric: radius_cv, scale: 0.18, weight: 0.30}

  marker_rotation_quality:
    components:
      pattern_coverage:
        {kind: coverage_deficit, metric: pattern_coverage, scale: 0.35, weight: 0.40}
      angular_reversal:
        {kind: residual, metric: angular_reversal_fraction, scale: 0.25, weight: 0.30}
      angular_fit:
        {kind: residual, metric: angular_fit_nrmse, scale: 0.35, weight: 0.30}

  pure_rolling_ratio:
    components:
      rolling_ratio_residual:
        {kind: residual, metric: M1_rolling_ratio_abs, scale: 0.25, weight: 1.0}

  contact_point_velocity:
    components:
      median_contact_residual:
        {kind: residual, metric: M2_contact_velocity_nmae, scale: 0.35, weight: 0.65}
      tail_contact_residual:
        {kind: residual, metric: M2_contact_velocity_p95, scale: 1.0, weight: 0.35}

overall_weights:
  task_structure: 0.20
  center_contact_geometry: 0.15
  marker_rotation_quality: 0.20
  pure_rolling_ratio: 0.30
  contact_point_velocity: 0.15
