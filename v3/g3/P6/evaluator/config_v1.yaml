schema_version: p6-evaluator-config-v1
task_id: P6
video_size: [1344, 768]

# Deterministic initialization on the six frozen accepted first frames.  These
# are not per-rollout labels: every seed from one first frame shares one ROI.
sources:
  P6_gpt_01_modern: {center: [378.0, 201.0], radius: 55.0}
  P6_gpt_02_classic: {center: [359.0, 215.0], radius: 59.0}
  P6_gpt_03_industrial: {center: [325.0, 216.0], radius: 57.0}
  P6_sim_01: {center: [363.0, 217.0], radius: 56.0}
  P6_sim_02: {center: [361.0, 221.0], radius: 56.0}
  P6_sim_03: {center: [359.0, 217.0], radius: 54.0}

tracking:
  min_track_coverage: 0.85
  min_pattern_coverage: 0.65
  min_motion_frames: 24
  min_angular_span_rad: 1.0
  motion_speed_radius_per_frame: 0.025
  max_center_step_radius: 0.75
  max_radius_cv: 0.18
  max_camera_drift_width: 0.02
  # A long interval without a directly visible circular boundary means the
  # generated ball has faded/morphed even if KLT keeps extrapolating position.
  hough_dropout_confidence: 0.10
  max_hough_dropout_run_frames: 12

# Each continuous error is mapped to 100 at/below `good`, linearly to zero at
# `bad`, and zero above it.  The values are versioned and must be frozen before
# formal benchmark comparisons.
thresholds:
  track_coverage: {good: 0.97, bad: 0.70, higher_is_better: true}
  pattern_coverage: {good: 0.90, bad: 0.55, higher_is_better: true}
  radius_cv: {good: 0.04, bad: 0.18}
  path_normal_p95_r: {good: 0.10, bad: 0.45}
  camera_drift_width: {good: 0.002, bad: 0.02}
  angular_reversal_fraction: {good: 0.03, bad: 0.25}
  angular_fit_nrmse: {good: 0.08, bad: 0.35}
  rolling_ratio_error: {good: 0.08, bad: 0.50}
  contact_velocity_nmae: {good: 0.10, bad: 0.60}
  contact_velocity_p95: {good: 0.20, bad: 1.00}

weights:
  task_structure: 0.20
  center_contact_geometry: 0.15
  marker_rotation_quality: 0.20
  pure_rolling_ratio: 0.30
  contact_point_velocity: 0.15

pass_rules:
  overall_min: 70.0
  dimension_floor: 55.0
  rolling_ratio_error_max: 0.25
  contact_velocity_nmae_max: 0.35
