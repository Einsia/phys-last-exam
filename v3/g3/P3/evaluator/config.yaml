  sam2_snapshot: "/mnt/einsia/aws01-nvme/einsia-shared/homes/gaomingju/workspace/physical-bench/cache/hf/hub/models--facebook--sam2.1-hiera-small/snapshots/ee5bba1d82bb8749febdf90f45e84b687142ba03"
