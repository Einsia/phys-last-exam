  default_device: "3"
  dtype: "bfloat16"

gates:
  min_frames: 12
  min_duration_s: 0.40
  min_fused_coverage_flight: 0.90
  min_fused_coverage_overall: 0.80
  min_primary_coverage_overall: 0.85
  min_backend_overlap_frames: 20
  max_internal_gap_frames: 3
  max_backend_disagreement_radii: 0.50
  max_camera_translation_diag: 0.020
  max_camera_scale_error: 0.010
  max_camera_rotation_deg: 0.50
  min_horizontal_span_diameters: 5.0
  border_margin_radii: 1.5
  release_displacement_radii: 0.40
  release_confirmation_frames: 3
  max_landing_level_error_diameters: 0.75

score_weights:
  task: 0.15
  parabola: 0.20
  horizontal: 0.15
  vertical: 0.20
  pair_consistency: 0.30

thresholds:
  sync_frames: {good: 1.0, bad: 4.0}
  angle_error_deg: {good: 3.0, bad: 12.0}
  landing_level_d: {good: 0.10, bad: 0.50}
  camera_translation_diag: {good: 0.002, bad: 0.020}
  integrity_error: {good: 0.10, bad: 0.45}
  parabola_rmse_d: {good: 0.08, bad: 0.30}
  parabola_p95_d: {good: 0.15, bad: 0.60}
  x_fit_rmse_d: {good: 0.08, bad: 0.30}
  vx_robust_cv: {good: 0.05, bad: 0.20}
  y_fit_rmse_d: {good: 0.08, bad: 0.30}
  vy_line_residual: {good: 0.05, bad: 0.20}
  ay_robust_cv: {good: 0.10, bad: 0.35}
  range_ratio_error: {good: 0.03, bad: 0.15}
  initial_speed_error: {good: 0.05, bad: 0.20}
  gravity_error: {good: 0.08, bad: 0.30}

pass_rules:
  overall_min: 70.0
  task_min: 70.0
  core_dimension_min: 60.0
  range_error_max: 0.08
  initial_speed_error_max: 0.10

